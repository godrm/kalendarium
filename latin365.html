<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lingua Latina 365</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="img/bg.webp" media="(min-width: 641px)">
<link rel="preload" as="image" href="img/bg-mobile.webp" media="(max-width: 640px)">
<style>
:root{
  --ink:#3a2312; --ink-soft:#6b4a2c; --parch:#f1e0b8; --parch-2:#e2c890; --parch-edge:#b98f4c;
  --gold:#d6a84a; --gold-hi:#f3d488; --wood:#2a1a10; --wood-2:#3d2716;
  --glow:#ffcf73; --ok:#5f9a3a; --ok-bg:#e3efc9; --no:#a8342a; --no-bg:#f4d6cc;
  --text:#f3e6c8; --text-dim:#c9b48e;
  --serif-la:"EB Garamond", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --serif-ko:"Noto Serif KR", "Apple SD Gothic Neo", "Nanum Myeongjo", serif;
  --display:"Cinzel", "Trajan Pro", Georgia, serif;
  --dlg-h:220px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:#120d0a; color:var(--text); font-family:var(--serif-ko);
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
button{font:inherit;color:inherit;cursor:pointer}

/* ---------- 배경: 대성당 도서관 ---------- */
/* 실제 이미지가 오기 전에는 32px 미리보기(인라인)가 흐릿하게 보인다 */
.bgimg{position:fixed;inset:0;z-index:-4;background-color:#120d0a;
  background-image:url("img/bg.webp"),url("data:image/webp;base64,UklGRoACAABXRUJQVlA4WAoAAAAgAAAAHwAAEQAASUNDUMgBAAAAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAChjcHJ0AAABjAAAADxtbHVjAAAAAAAAAAEAAAAMZW5VUwAAAAgAAAAcAHMAUgBHAEJYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9YWVogAAAAAAAA9tYAAQAAAADTLXBhcmEAAAAAAAQAAAACZmYAAPKnAAANWQAAE9AAAApbAAAAAAAAAABtbHVjAAAAAAAAAAEAAAAMZW5VUwAAACAAAAAcAEcAbwBvAGcAbABlACAASQBuAGMALgAgADIAMAAxADZWUDggkgAAAJAEAJ0BKiAAEgA+0VajS6gkoyGwCAEAGgljAK4cHon++U0ZfG2G8elhoUktCAD+7xj1uUXT6vO2lX6vBfc48eFvvaUWTZzuPJ9QmcQAlT+FdJoN07KfATxPb896x0Jp+kc+24fDeC6o8SAzjNgDwq92DGFVO/jp+M2w0hF0KIsRo8zdrsMN0JPrCdE8o/LVAAAA");
  background-size:cover;background-position:center 35%;background-repeat:no-repeat}
.candlelight{position:fixed;inset:0;z-index:-3;pointer-events:none;mix-blend-mode:screen;
  background:radial-gradient(ellipse 22% 40% at 4% 30%,rgba(255,170,70,.16),transparent 70%),
             radial-gradient(ellipse 22% 40% at 96% 45%,rgba(255,170,70,.14),transparent 70%);
  animation:cglow 2.3s ease-in-out infinite alternate}
.vignette{position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
    radial-gradient(ellipse 60% 45% at 50% 30%, rgba(255,200,120,.10), transparent 70%),
    radial-gradient(ellipse at 50% 45%, transparent 30%, rgba(5,3,2,.8) 100%),
    linear-gradient(rgba(10,6,3,.18),rgba(10,6,3,.18) 60%,rgba(10,6,3,.55));}
.motes{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.motes i{position:absolute;width:3px;height:3px;border-radius:50%;background:#ffe6a8;opacity:0;
  filter:blur(.4px);animation:mote 14s linear infinite}
@keyframes mote{0%{transform:translate(0,0);opacity:0}15%{opacity:.7}85%{opacity:.5}100%{transform:translate(40px,-260px);opacity:0}}
@keyframes cglow{0%{opacity:.6}40%{opacity:1}70%{opacity:.75}100%{opacity:.9}}

/* ---------- 레이아웃 ---------- */
.app{max-width:780px;margin:0 auto;padding:14px 16px calc(var(--dlg-h) + 28px)}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;letter-spacing:.12em;font-size:1.05rem;color:var(--gold-hi);
  text-shadow:0 0 12px rgba(255,190,90,.45),0 2px 0 #000;margin-right:auto;white-space:nowrap}
.brand span{color:var(--text);opacity:.85}
.stats{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:rgba(20,12,7,.72);border:1px solid rgba(214,168,74,.45);border-radius:999px;
  padding:4px 10px;font-size:.8rem;color:var(--text);white-space:nowrap;backdrop-filter:blur(2px)}
.chip b{color:var(--gold-hi);font-weight:700}
.actions{display:flex;gap:6px}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid rgba(214,168,74,.6);
  background:radial-gradient(circle at 35% 30%,#4a3020,#1d120a);font-size:1.05rem;
  box-shadow:0 2px 8px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,220,150,.25)}
.iconbtn:hover{border-color:var(--gold-hi)}

.tabs{display:flex;gap:8px;margin:14px 0 10px}
.tab{flex:1;min-width:0;padding:9px 6px;border-radius:10px 10px 4px 4px;border:1px solid rgba(214,168,74,.45);
  background:linear-gradient(#3a2616,#22150c);color:var(--text-dim);font-size:.85rem;line-height:1.25;
  box-shadow:inset 0 1px 0 rgba(255,220,150,.15)}
.tab small{display:block;font-family:var(--display);font-size:.68rem;letter-spacing:.06em;opacity:.8}
.tab.active{background:linear-gradient(#f3e2ba,#dcc08a);color:var(--ink);border-color:var(--gold);
  box-shadow:0 0 14px rgba(255,200,110,.35)}
.tab:disabled{opacity:.42;cursor:not-allowed}
.tab .done{color:var(--ok)}
.tab.active .done{color:#3f7a1f}

.progress{height:10px;border-radius:999px;background:rgba(0,0,0,.55);border:1px solid rgba(214,168,74,.35);overflow:hidden;margin-bottom:12px}
.progress i{display:block;height:100%;width:0;border-radius:999px;
  background:linear-gradient(90deg,#9c6b1f,var(--gold),var(--gold-hi));box-shadow:0 0 10px rgba(255,200,110,.6);transition:width .45s ease}

/* ---------- 양피지 카드 ---------- */
.card{position:relative;color:var(--ink);padding:26px 24px 22px;border-radius:6px;min-height:260px;
  background:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .3  0 0 0 0 .12  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
    radial-gradient(ellipse at 50% 40%, #f7e9c6 0%, var(--parch) 45%, var(--parch-2) 85%, #c9a465 100%);
  border:1px solid var(--parch-edge);
  box-shadow:inset 0 0 50px rgba(120,75,25,.45), inset 0 0 0 6px rgba(255,245,220,.25), 0 14px 36px rgba(0,0,0,.7), 0 0 40px rgba(255,190,100,.12);
  animation:unroll .45s ease}
.card::before{content:"";position:absolute;inset:8px;border:1px solid rgba(160,115,45,.55);border-radius:3px;pointer-events:none;
  box-shadow:inset 0 0 0 3px rgba(214,168,74,.18)}
@keyframes unroll{from{opacity:0;transform:translateY(8px) scaleY(.96)}to{opacity:1;transform:none}}
.kicker{font-family:var(--display);font-size:.72rem;letter-spacing:.16em;color:#8a5a22;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.latin{font-family:var(--serif-la);font-weight:600;font-size:clamp(1.9rem,6vw,2.9rem);line-height:1.15;margin:18px 0 8px;color:#2a160a;word-break:keep-all;overflow-wrap:anywhere}
.latin .initial{font-family:var(--display);font-weight:700;color:#8e1f17;font-size:1.45em;line-height:.8;
  text-shadow:0 1px 0 #f3d488, 0 0 1px #5a1009;margin-right:.02em}
.meaning{font-size:1.15rem;color:var(--ink-soft);margin:0 0 6px}
.note{margin-top:14px;padding:10px 12px;border-left:3px solid #8e1f17;background:rgba(142,31,23,.07);font-size:.92rem;color:#4b2e18;border-radius:0 4px 4px 0}
.prompt{font-size:.95rem;color:#7a5530;margin-top:4px}
.qbig{font-size:clamp(1.5rem,5vw,2.2rem);margin:16px 0 4px;font-weight:600;color:#2a160a;word-break:keep-all;overflow-wrap:anywhere}
.qbig.la{font-family:var(--serif-la)}
.speak{margin-left:6px;vertical-align:middle;width:40px;height:40px;border-radius:50%;border:1px solid var(--parch-edge);
  background:radial-gradient(circle at 35% 30%,#fff6dd,#e3c98f);font-size:1.1rem;box-shadow:0 2px 4px rgba(90,50,10,.35)}
.banner{margin-top:16px;padding:10px 14px;border-radius:6px;font-weight:600;animation:unroll .3s ease}
.banner.ok{background:var(--ok-bg);color:#2f5a14;border:1px solid #9cc070}
.banner.no{background:var(--no-bg);color:#7a1f16;border:1px solid #d99a8a}
.banner .la{font-family:var(--serif-la);font-size:1.1em}

/* 단어 배열 */
.answer{min-height:58px;margin:18px 0 10px;padding:8px;border-bottom:2px solid rgba(110,70,30,.45);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.answer:empty::before{content:"단어를 눌러 이곳에 옮겨 적으세요";color:#9a7a52;font-size:.9rem}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding-top:6px}
.tile{font-family:var(--serif-la);font-size:1.2rem;padding:8px 14px;border-radius:8px;color:#2a160a;
  background:linear-gradient(#fff8e6,#efdcb0);border:1px solid #b58c4c;box-shadow:0 3px 0 #9c7440,0 4px 8px rgba(60,30,5,.25);transition:transform .12s}
.tile:active{transform:translateY(2px);box-shadow:0 1px 0 #9c7440}
.tile.used{visibility:hidden}
.tile:disabled{cursor:default}
.typein{width:100%;margin:18px 0 6px;padding:12px 14px;font-family:var(--serif-la);font-size:1.4rem;color:#2a160a;
  background:rgba(255,250,235,.7);border:1px solid #b58c4c;border-radius:8px;outline:none}
.typein:focus{border-color:#8e1f17;box-shadow:0 0 0 3px rgba(142,31,23,.15)}

/* 완료 카드 */
.done-title{font-family:var(--display);font-size:clamp(1.6rem,6vw,2.3rem);color:#8e1f17;text-align:center;margin:8px 0 2px;letter-spacing:.06em}
.done-sub{text-align:center;color:var(--ink-soft);margin:0 0 14px}
.statrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0 16px}
.stat{min-width:96px;text-align:center;padding:8px 10px;border-radius:8px;background:rgba(255,250,235,.55);border:1px solid rgba(160,115,45,.5)}
.stat b{display:block;font-family:var(--display);font-size:1.4rem;color:#6b3a10}
.stat span{font-size:.78rem;color:#7a5530}
.recap{text-align:center}
.recap .latin{font-size:clamp(1.5rem,5vw,2.1rem);margin:6px 0 2px}
.review h4{font-family:var(--display);font-size:.78rem;letter-spacing:.14em;color:#8a5a22;margin:18px 0 8px;text-transform:uppercase}
.minis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.mini{padding:10px 12px;border-radius:6px;background:rgba(255,250,235,.5);border:1px dashed rgba(140,95,35,.55)}
.mini .la{font-family:var(--serif-la);font-weight:600;font-size:1.1rem}
.mini .ko{font-size:.88rem;color:var(--ink-soft)}
.mini small{font-family:var(--display);font-size:.66rem;color:#9a7040;letter-spacing:.08em}
.sparks{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.sparks i{position:absolute;top:30%;width:6px;height:6px;background:var(--gold-hi);border-radius:1px;transform:rotate(45deg);
  box-shadow:0 0 8px #ffd27a;opacity:0;animation:spark 1.6s ease-out forwards}
@keyframes spark{0%{opacity:1;transform:translate(0,0) rotate(45deg) scale(.6)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(225deg) scale(1)}}

/* LLM 패널 */
.llm{margin-top:18px;padding:14px 14px 10px;border-radius:6px;background:rgba(255,252,240,.6);border:1px solid rgba(160,115,45,.55);animation:unroll .35s ease}
.llm h4{margin:0 0 10px;font-family:var(--display);font-size:.8rem;letter-spacing:.14em;color:#8a5a22;text-transform:uppercase}
.llm .row{margin:0 0 10px}
.llm .lbl{font-size:.75rem;color:#8a5a22;font-weight:700;letter-spacing:.04em}
.llm .val{font-size:1rem}
.llm ul{margin:4px 0 0;padding-left:18px}
.llm li{margin:2px 0}
.llm .em{font-family:var(--serif-la);font-style:italic;font-weight:600}
.llm .tip{padding:8px 10px;background:rgba(214,168,74,.18);border-radius:4px}
.llm pre{white-space:pre-wrap;font-family:inherit;font-size:.92rem;margin:0}
.llm .err{color:#7a1f16;font-size:.92rem}
.quill{display:inline-block;animation:quill 1s ease-in-out infinite}
@keyframes quill{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg) translateX(3px)}}

/* ---------- NPC 대화창 ---------- */
.dialog{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(980px,calc(100% - 20px));z-index:20;
  display:grid;grid-template-columns:208px 1fr;gap:0;align-items:end}
.portrait{position:relative;width:208px;height:208px;margin-bottom:10px;z-index:2;border-radius:8px;overflow:hidden;
  border:3px solid var(--gold);box-shadow:0 0 0 2px #2a170b,0 0 0 4px rgba(214,168,74,.55),0 10px 30px rgba(0,0,0,.8),0 0 30px rgba(255,180,80,.25);
  background:#0d0805}
.portrait svg{display:block;width:100%;height:100%}
.dbody{position:relative;margin-left:-14px;padding:16px 20px 14px 30px;min-height:132px;border-radius:10px;cursor:pointer;
  background:linear-gradient(180deg,rgba(38,24,14,.94),rgba(18,11,6,.96));
  border:2px solid var(--gold);box-shadow:0 0 0 2px #1a0e06,0 0 0 4px rgba(214,168,74,.35),0 12px 34px rgba(0,0,0,.85),inset 0 0 30px rgba(0,0,0,.6)}
.dbody::before,.dbody::after{content:"✦";position:absolute;color:var(--gold);font-size:.8rem;top:4px}
.dbody::before{left:10px}.dbody::after{right:10px}
.name{position:absolute;top:-15px;left:28px;font-family:var(--display);font-weight:700;font-size:.82rem;letter-spacing:.12em;
  padding:3px 12px;border-radius:4px;color:#2a160a;background:linear-gradient(#f6dc96,#c99a3e);border:1px solid #7a5520;box-shadow:0 2px 6px rgba(0,0,0,.6)}
.dtext{margin:6px 0 0;font-size:1.04rem;line-height:1.65;min-height:3.3em;color:#f6ead0;text-shadow:0 1px 0 #000;word-break:keep-all;overflow-wrap:anywhere}
.dnext{position:absolute;right:16px;bottom:8px;color:var(--gold-hi);font-size:.85rem;animation:bob .8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
.choices{display:flex;flex-direction:column;gap:7px;margin-top:10px}
.choices:empty{display:none}
.choice{display:flex;align-items:center;gap:10px;text-align:left;padding:9px 12px;border-radius:6px;
  background:linear-gradient(90deg,rgba(214,168,74,.16),rgba(214,168,74,.05));border:1px solid rgba(214,168,74,.5);color:#f6ead0;font-size:.98rem;
  transition:background .15s,border-color .15s,transform .1s}
.choice:hover:not(:disabled){background:linear-gradient(90deg,rgba(214,168,74,.32),rgba(214,168,74,.1));border-color:var(--gold-hi);transform:translateX(3px)}
.choice .k{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:.72rem;
  background:var(--gold);color:#2a160a;font-weight:700}
.choice.la .t{font-family:var(--serif-la);font-size:1.08rem}
.choice:disabled{cursor:default;opacity:.55}
.choice.correct{opacity:1;background:linear-gradient(90deg,rgba(110,170,70,.45),rgba(110,170,70,.12));border-color:#a7d47a}
.choice.correct .k{background:#9fd06a}
.choice.wrong{opacity:1;background:linear-gradient(90deg,rgba(190,60,45,.45),rgba(190,60,45,.12));border-color:#e48b7c}
.choice.wrong .k{background:#e48b7c}

/* 수도사 초상 */
.portrait img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  transform-origin:50% 40%;animation:breathe 5.2s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1) translateY(0)}50%{transform:scale(1.015) translateY(-.6px)}}
.portrait.talking img{animation:talk .36s ease-in-out infinite alternate}
@keyframes talk{from{transform:scale(1) translateY(0)}to{transform:scale(1.008) translateY(.7px) rotate(.25deg)}}
.portrait.nod img{animation:nod .7s ease}
@keyframes nod{0%,100%{transform:none}35%{transform:translateY(2.5px) rotate(1deg)}65%{transform:translateY(-.5px)}}
.portrait.swap img{animation:swapin .3s ease}
@keyframes swapin{from{opacity:.35;filter:brightness(1.3)}to{opacity:1;filter:none}}
.pflicker{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;
  background:radial-gradient(circle at 8% 40%,rgba(255,170,70,.28),transparent 60%),radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.45) 100%);
  animation:mflick 2.1s ease-in-out infinite alternate}
@keyframes mflick{0%{opacity:.7}25%{opacity:1}55%{opacity:.8}80%{opacity:.95}100%{opacity:.85}}

/* ---------- 모달 ---------- */
.modal{position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:16px;background:rgba(5,3,2,.72);backdrop-filter:blur(3px)}
.modal.open{display:grid}
.modal .card{width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto}
.modal h3{font-family:var(--display);letter-spacing:.1em;margin:0 0 12px;color:#6b2a10}
.modal label{display:block;font-size:.82rem;font-weight:700;color:#7a5530;margin:12px 0 4px}
.field{display:flex;gap:6px}
.field input{flex:1;min-width:0;padding:10px 12px;border-radius:6px;border:1px solid #b58c4c;background:rgba(255,250,235,.8);font-size:.95rem;color:#2a160a}
.btn{padding:9px 14px;border-radius:6px;border:1px solid #7a5520;background:linear-gradient(#f3d488,#c99a3e);color:#2a160a;font-weight:700;font-size:.9rem}
.btn.ghost{background:rgba(255,250,235,.6);border-color:#b58c4c}
.btn.danger{background:linear-gradient(#e7a596,#b8513f);color:#fff;border-color:#7a2a1c}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.help{font-size:.8rem;color:#7a5530;margin:6px 0 0;line-height:1.5}
.testout{font-size:.88rem;margin-top:10px;min-height:1.2em;word-break:break-all}
.testout.ok{color:#2f5a14}.testout.no{color:#7a1f16}
.close{position:absolute;top:10px;right:12px;border:0;background:none;font-size:1.4rem;color:#7a5530;z-index:2}
.divider{height:1px;background:rgba(160,115,45,.45);margin:18px 0 6px}
.list{list-style:none;margin:0;padding:0}
.list li{display:grid;grid-template-columns:56px 1fr auto;gap:8px;align-items:baseline;padding:7px 0;border-bottom:1px dashed rgba(140,95,35,.4)}
.list .d{font-family:var(--display);font-size:.72rem;color:#9a7040}
.list .la{font-family:var(--serif-la);font-weight:600;font-size:1.05rem}
.list .ko{display:block;font-size:.85rem;color:var(--ink-soft)}
.list .ck{color:var(--ok)}

/* ---------- 모바일 ---------- */
@media (max-width:640px){

</div>

</div>

<!-- 키 설정 -->

</div>

/* ================= 날짜 ================= */
function ymd(d){ return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function parseYmd(s){ const [y, m, d] = s.split("-").map(Number); return Date.UTC(y, m - 1, d); }
function daysBetween(a, b){ return Math.round((parseYmd(b) - parseYmd(a)) / 86400000); }
function todayStr(){ return ymd(new Date()); }
function yesterdayStr(){ const d = new Date(); d.setDate(d.getDate() - 1); return ymd(d); }
function todayN(){ return Math.max(1, daysBetween(state.startDate, todayStr()) + 1); }
function phraseFor(n){ return PHRASES[(n - 1) % PHRASES.length]; }
function cycleOf(n){ return Math.floor((n - 1) / PHRASES.length) + 1; }
function currentStreak(){ return (state.lastDoneDate === todayStr() || state.lastDoneDate === yesterdayStr()) ? state.streak : 0; }

function setMood(m){
  const FALLBACK = { celebrate: "happy", thinking: "smile", happy: "smile", encourage: "smile" };
  let k = m; while (!MONK_IMG[k] && FALLBACK[k]) k = FALLBACK[k];

  if (monkImg.getAttribute("src") !== src) {
    monkImg.src = src;
    portrait.classList.remove("swap"); void portrait.offsetWidth; portrait.classList.add("swap");
  }
  if (m === "happy" || m === "celebrate") { portrait.classList.remove("nod"); void portrait.offsetWidth; portrait.classList.add("nod"); }
}
function talk(on){ portrait.classList.toggle("talking", on && !reducedMotion); }

/* ================= 대화창 ================= */
const D = { text: $("#dtext"), next: $("#dnext"), choices: $("#choices"), body: $("#dbody"),
  queue: [], typing: false, full: "", i: 0, timer: null, done: null, choiceResolve: null };

function say(lines, mood = "smile", opts = {}){
  return new Promise((res) => {
    if (!opts.keep) clearChoices();
    setMood(mood);
    D.queue = (Array.isArray(lines) ? lines : [lines]).filter(Boolean);
    D.done = res; D.waitEnd = !!opts.wait; D.pendingEnd = false;
    nextLine();
  });
}
function nextLine(){
  if (!D.queue.length) { D.next.hidden = true; const r = D.done; D.done = null; r && r(); return; }
  typeLine(D.queue.shift());
}
function typeLine(txt){
  clearInterval(D.timer);
  D.full = txt; D.i = 0; D.typing = true; D.next.hidden = true;
  D.text.textContent = "";
  if (reducedMotion) return finishTyping();
  talk(true);
  D.timer = setInterval(() => {
    D.i += 1;
    D.text.textContent = D.full.slice(0, D.i);
    if (D.i >= D.full.length) finishTyping();
  }, 26);
}
function finishTyping(){
  clearInterval(D.timer); talk(false);
  D.text.textContent = D.full; D.typing = false;
  if (D.queue.length) D.next.hidden = false;
  else if (D.waitEnd) { D.next.hidden = false; D.pendingEnd = true; }
  else nextLine();
}
function advance(){
  if (D.typing) finishTyping();
  else if (D.queue.length) nextLine();
  else if (D.pendingEnd) { D.pendingEnd = false; nextLine(); }
}
function clearChoices(){ D.choices.innerHTML = ""; D.choiceResolve = null; }
function choices(labels, opts = {}){
  return new Promise((res) => {
    D.choices.innerHTML = "";
    D.choiceResolve = res;
    labels.forEach((label, i) => {
      const b = document.createElement("button");
      b.className = "choice" + (opts.latin ? " la" : "");
      b.innerHTML = `<span class="k">${i + 1}</span><span class="t">${esc(label)}</span>`;
      b.addEventListener("click", (e) => {
        e.stopPropagation();
        if (!D.choiceResolve) return;
        const r = D.choiceResolve; D.choiceResolve = null;
        D.choices.querySelectorAll(".choice").forEach((x) => x.disabled = true);
        r(i);
      });
      D.choices.appendChild(b);
    });
  });
}
function markChoices(chosen, correct){
  const bs = D.choices.querySelectorAll(".choice");
  if (bs[correct]) bs[correct].classList.add("correct");
  if (chosen !== correct && bs[chosen]) bs[chosen].classList.add("wrong");
}
D.body.addEventListener("click", advance);
document.addEventListener("keydown", (e) => {
  if (document.querySelector(".modal.open")) { if (e.key === "Escape") closeModals(); return; }
  if (e.target.matches("input, textarea")) return;
  if (e.key === " " || e.key === "Enter") {
    if (D.typing || D.queue.length || D.pendingEnd) { e.preventDefault(); advance(); }
  } else if (/^[1-9]$/.test(e.key)) {
    const b = D.choices.querySelectorAll(".choice")[Number(e.key) - 1];
    if (b && !b.disabled) b.click();
  }
});

  [["그제", n - 2], ["어제", n - 1], ["오늘", n], ["내일", n + 1]].forEach(([label, dn]) => {
    const b = document.createElement("button");
    b.className = "tab" + (dn === activeN ? " active" : "");
    const future = dn > n, none = dn < 1;
    b.disabled = future || none;
    const mark = state.completed[dn] ? ' <span class="done">✓</span>' : "";
    b.innerHTML = future ? `${label} 🔒<small>잠김</small>` : none ? `${label}<small>—</small>` : `${label}${mark}<small>DIES ${phraseFor(dn).d}</small>`;
    if (!b.disabled) b.addEventListener("click", () => openDay(dn));
    tabs.appendChild(b);
  });
}
function setProgress(i, total){ $("#prog").style.width = Math.round((i / total) * 100) + "%"; }

/* ================= 음성 ================= */
let voice = null;
function pickVoice(){
  if (!("speechSynthesis" in window)) return;
  const vs = speechSynthesis.getVoices();
  voice = vs.find((v) => /^la/i.test(v.lang)) || vs.find((v) => /^it/i.test(v.lang)) || null;
  document.querySelectorAll(".speak").forEach((b) => { b.hidden = !voice; b.title = voice && !/^la/i.test(voice.lang) ? "근사 발음 (이탈리아어 음성)" : "발음 듣기"; });
}
if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.addEventListener("voiceschanged", pickVoice); }
function speak(text){
  if (!voice) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/\.\.\./g, ""));
  u.voice = voice; u.lang = voice.lang; u.rate = 0.82;
  speechSynthesis.speak(u);
}
function speakBtn(la){ return `<button class="speak" type="button" data-say="${esc(la)}" ${voice ? "" : "hidden"} title="${voice && !/^la/i.test(voice.lang) ? "근사 발음 (이탈리아어 음성)" : "발음 듣기"}" aria-label="발음 듣기">🔊</button>`; }
document.addEventListener("click", (e) => { const b = e.target.closest(".speak"); if (b) speak(b.dataset.say); });

/* ================= 카드 렌더 ================= */
const card = $("#card");
function kicker(n, p){ return `<div class="kicker"><span>Unitas ${p.u + 1} · ${esc(UNITS[p.u])}</span><span>Dies ${p.d}${cycleOf(n) > 1 ? " · " + cycleOf(n) + "회차" : ""}</span></div>`; }
function latinHTML(la){ return `<span class="initial">${esc(la[0])}</span>${esc(la.slice(1))}`; }
function setCard(html){ card.style.animation = "none"; void card.offsetWidth; card.style.animation = ""; card.innerHTML = html; }

function renderIntro(n, p){
  setCard(`${kicker(n, p)}
    <div class="latin">${latinHTML(p.la)} ${speakBtn(p.la)}</div>
    <p class="meaning">${esc(p.ko)}</p>
    ${p.note ? `<div class="note">✒️ ${esc(p.note)}</div>` : ""}`);
}
function renderQuestion(n, p, label, big, isLatin){
  setCard(`${kicker(n, p)}
    <p class="prompt">${esc(label)}</p>
    <div class="qbig ${isLatin ? "la" : ""}">${esc(big)} ${isLatin ? speakBtn(big) : ""}</div>`);
}
function showBanner(ok, answer, isLatin){
  const div = document.createElement("div");
  div.className = "banner " + (ok ? "ok" : "no");
  div.innerHTML = ok ? "✓ 정답입니다!" : `✗ 정답: <span class="${isLatin ? "la" : ""}">${esc(answer)}</span>`;

/* ================= 레슨 흐름 ================= */
let flowId = 0;
const alive = (id) => id === flowId;

function openDay(n, greetLines = []){
  const id = ++flowId;
  activeN = n;
  renderTabs();
  if (state.completed[n]) showSummary(n, id, [...greetLines, pick(LINES.already)], false);
  else runLesson(n, id, greetLines);
}

async function runLesson(n, id, greetLines = []){
  const p = phraseFor(n);
  const last = words(p.la).length > 1 ? "arrange" : "type";
  const queue = [{ t: "intro" }, { t: "mcq-ko" }, { t: "mcq-la" }, { t: last }];
  for (let i = 0; i < queue.length; i++) {
    if (!alive(id)) return;
    setProgress(i, queue.length);
    const st = queue[i];
    if (st.t === "intro") { await stepIntro(n, p, id, greetLines); continue; }
    const prefix = st.retry ? [pick(LINES.retry)] : [];
    let ok;
    if (st.t === "mcq-ko") ok = await stepMCQ(n, p, "ko", id, prefix);
    else if (st.t === "mcq-la") ok = await stepMCQ(n, p, "la", id, prefix);
    else if (st.t === "arrange") ok = await stepArrange(n, p, id, prefix);
    else ok = await stepType(n, p, id, prefix);
    if (!alive(id)) return;
    if (!ok && !st.retry) queue.push({ t: st.t, retry: true });
  }
  setProgress(1, 1);
  finishLesson(n, id);
}

async function stepIntro(n, p, id, greetLines){
  renderIntro(n, p);
  const isPast = n < todayN();
  const lines = [...greetLines, isPast ? pick(LINES.past) : pick(LINES.intro), `"${p.la}" — ${p.ko}`];
  await say(lines, "smile");
  while (alive(id)) {
    const c = await choices(["문제 풀러 가기 →", "🌍 익숙한 언어로 연결"]);
    if (!alive(id)) return;
    if (c === 0) return;
    await connectLanguages(p, id);
  }
}

function distractors(p, field, k = 3){
  const seen = new Set([p[field]]);
  const out = [];
  const take = (list) => { for (const q of shuffle(list)) { if (out.length >= k) break; if (!seen.has(q[field])) { seen.add(q[field]); out.push(q); } } };
  take(PHRASES.filter((q) => q.u === p.u && q !== p));
  if (out.length < k) take(PHRASES);
  return out;
}

async function stepMCQ(n, p, dir, id, prefix){
  const field = dir === "ko" ? "ko" : "la";
  if (dir === "ko") renderQuestion(n, p, "이 표현의 뜻은 무엇일까요?", p.la, true);
  else renderQuestion(n, p, "라틴어로는 어떻게 말할까요?", p.ko, false);
  await say([...prefix, pick(dir === "ko" ? LINES.askMeaning : LINES.askLatin)], "smile");
  if (!alive(id)) return;
  const opts = shuffle([p, ...distractors(p, field)]);
  const i = await choices(opts.map((o) => o[field]), { latin: dir === "la" });
  if (!alive(id)) return;
  const ok = opts[i] === p;
  markChoices(i, opts.indexOf(p));
  return feedback(ok, p[field], dir === "la", id);
}

async function feedback(ok, answer, isLatin, id){
  showBanner(ok, answer, isLatin);
  if (ok) await say(pick(LINES.right), "happy", { keep: true });
  else await say([pick(LINES.wrong), `정답은 "${answer}"였다네.`], "encourage", { keep: true });
  if (!alive(id)) return;
  await choices(["계속 →"]);
  if (!alive(id)) return;
  return ok;
}

async function stepArrange(n, p, id, prefix){
  const target = words(p.la);
  const targetSet = new Set(target.map(norm));
  const extras = [];
  for (const q of shuffle(PHRASES.filter((q) => q.u === p.u && q !== p))) {
    for (const w of words(q.la)) { if (extras.length < 2 && !targetSet.has(norm(w)) && !extras.some((x) => norm(x) === norm(w))) extras.push(w); }
    if (extras.length >= 2) break;
  }
  const tiles = shuffle([...target, ...extras]).map((w, i) => ({ w, i }));
  const picked = [];
  setCard(`${kicker(n, p)}
    <p class="prompt">이 뜻을 라틴어로 옮겨 보세요</p>
    <div class="qbig">${esc(p.ko)}</div>
    <div class="answer" id="answer"></div>
    <div class="bank" id="bank"></div>`);
  const answerEl = $("#answer"), bankEl = $("#bank");
  let locked = false;
  const draw = () => {
    answerEl.innerHTML = ""; bankEl.innerHTML = "";
    picked.forEach((t, k) => {
      const b = document.createElement("button");
      b.className = "tile"; b.textContent = t.w; b.disabled = locked;
      b.onclick = () => { if (locked) return; picked.splice(k, 1); draw(); };
      answerEl.appendChild(b);
    });
    tiles.forEach((t) => {
      const b = document.createElement("button");
      const used = picked.includes(t);
      b.className = "tile" + (used ? " used" : ""); b.textContent = t.w; b.disabled = locked || used;
      b.onclick = () => { if (locked || picked.includes(t)) return; picked.push(t); draw(); };
      bankEl.appendChild(b);
    });
  };
  draw();
  await say([...prefix, pick(LINES.arrange)], "smile");
  while (alive(id)) {
    await choices(["확인하기"]);
    if (!alive(id)) return;
    if (picked.length) break;
    await say("먼저 단어를 골라 옮겨 적어 보게.", "encourage");
  }
  if (!alive(id)) return;
  locked = true; draw();
  const ok = norm(picked.map((t) => t.w).join(" ")) === norm(p.la);
  return feedback(ok, p.la, true, id);
}

async function stepType(n, p, id, prefix){
  const plain = p.la.replace(/[^A-Za-z]/g, "");
  setCard(`${kicker(n, p)}
    <p class="prompt">이 뜻을 라틴어로 써 보세요</p>
    <div class="qbig">${esc(p.ko)}</div>
    <input class="typein" id="typein" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${esc(plain[0])}${"_".repeat(Math.max(0, plain.length - 1))}" aria-label="라틴어 입력">`);
  const input = $("#typein");
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); const b = D.choices.querySelector(".choice"); b && !b.disabled && b.click(); } });
  await say([...prefix, pick(LINES.type)], "smile");
  if (!alive(id)) return;
  input.focus({ preventScroll: true });
  while (alive(id)) {
    await choices(["확인하기"]);
    if (!alive(id)) return;
    if (input.value.trim()) break;
    await say("한 글자라도 적어 보게나.", "encourage");
    input.focus({ preventScroll: true });
  }
  if (!alive(id)) return;
  input.disabled = true;
  const ok = norm(input.value) === norm(p.la);
  return feedback(ok, p.la, true, id);
}

function finishLesson(n, id){
  const t = todayStr();
  state.completed[n] = true;
  if (!state.studyLog.includes(t)) state.studyLog.push(t);
  if (n === todayN() && state.lastDoneDate !== t) {
    state.streak = state.lastDoneDate === yesterdayStr() ? (state.streak || 0) + 1 : 1;
    state.lastDoneDate = t;
  }
  save();
  renderHeader(); renderTabs();
  showSummary(n, id, [pick(LINES.done)], true);
}

async function showSummary(n, id, lines, celebrate){
  const p = phraseFor(n);
  setProgress(1, 1);
  const prev = [n - 1, n - 2].filter((x) => x >= 1).map((x) => ({ x, q: phraseFor(x) }));
  setCard(`${celebrate ? `<div class="sparks">${Array.from({ length: 18 }, (_, i) => `<i style="left:${10 + Math.random() * 80}%;--dx:${(Math.random() * 160 - 80).toFixed(0)}px;--dy:${(-Math.random() * 120 - 20).toFixed(0)}px;animation-delay:${(i * 0.04).toFixed(2)}s"></i>`).join("")}</div>` : ""}
    ${kicker(n, p)}
    <div class="done-title">${celebrate ? "Bene fecisti!" : "Iam perfectum ✓"}</div>
    <p class="done-sub">${celebrate ? "오늘의 구절을 익혔습니다" : "이미 마친 구절입니다"}</p>
    <div class="recap"><div class="latin">${latinHTML(p.la)} ${speakBtn(p.la)}</div><p class="meaning">${esc(p.ko)}</p></div>
    <div class="statrow">
      <div class="stat"><b>${currentStreak()}</b><span>연속 학습</span></div>
      <div class="stat"><b>${todayN()}</b><span>학습 N일째</span></div>
      <div class="stat"><b>${state.studyLog.length}</b><span>실제 학습한 날</span></div>
    </div>
    ${prev.length ? `<div class="review"><h4>Repetitio · 지난 구절 복습</h4><div class="minis">${prev.map(({ x, q }) => `<div class="mini"><small>DIES ${q.d}</small><div class="la">${esc(q.la)}</div><div class="ko">${esc(q.ko)}</div></div>`).join("")}</div></div>` : ""}`);
  await say(lines, celebrate ? "celebrate" : "smile");
  while (alive(id)) {
    const opts = ["🌍 익숙한 언어로 연결", "↺ 다시 풀기"];
    if (n !== todayN()) opts.push("오늘의 구절로 →");
    const c = await choices(opts);
    if (!alive(id)) return;
    if (c === 0) await connectLanguages(p, id);
    else if (c === 1) { const nid = ++flowId; runLesson(n, nid); return; }
    else { openDay(todayN()); return; }
  }
}

/* ================= LLM: 익숙한 언어로 연결 ================= */
const SYSTEM_PROMPT = `너는 한국인 라틴어 입문자를 돕는 친절한 언어 선생님이다. 주어진 라틴어 표현을 학습자에게 익숙한 언어와 연결해 준다.
반드시 아래 형식의 JSON 객체 하나만 출력하라. 다른 설명이나 코드 펜스는 쓰지 마라. ko, meaning, tip 같은 설명은 모두 한국어로 쓴다. 확실하지 않은 어원은 넣지 마라.
{
  "english": "자연스러운 영어 대응 표현",
  "similar": [{"lang": "언어 이름(한국어)", "text": "그 언어의 표현", "ko": "한국어 뜻"}],
  "koreanIdiom": "비슷한 한국어 표현이나 속담 (없으면 빈 문자열)",
  "cognates": [{"word": "단어", "lang": "언어 이름(한국어)", "meaning": "한국어 뜻과 라틴어와의 연결"}],
  "tip": "외우기 쉬운 한 줄 팁"
}
similar에는 스페인어·프랑스어·이탈리아어 등 로망스어 표현을 2~3개, cognates에는 같은 라틴어 어근에서 온 영어 등의 단어를 2~4개 넣어라.`;

async function callLLM(system, user, { maxTokens = 800, key = getKey(), model = getModel() } = {}){
  if (!key) throw new Error("API 키가 설정되지 않았습니다.");
  let res;
  try {
    res = await fetch(CHAT_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + key },
      body: JSON.stringify({ model, max_tokens: maxTokens, messages: [{ role: "system", content: system }, { role: "user", content: user }] })
    });
  } catch (e) {
    throw new Error("게이트웨이에 연결하지 못했습니다. 네트워크 문제이거나 게이트웨이가 브라우저의 직접 호출(CORS)을 허용하지 않는 경우입니다. file:// 대신 `python3 -m http.server`로 페이지를 띄워 보거나, 게이트웨이 관리자에게 CORS 허용을 요청하세요.");
  }
  const raw = await res.text();
  let json = null;
  try { json = JSON.parse(raw); } catch (e) {}
  if (res.status === 401 || res.status === 403) throw new Error(`API 키를 확인해 주세요. (HTTP ${res.status})`);
  if (!res.ok) throw new Error(`게이트웨이 오류 HTTP ${res.status}: ${(json && json.error && (json.error.message || json.error)) || raw.slice(0, 200)}`);
  const content = json && json.choices && json.choices[0] && json.choices[0].message && json.choices[0].message.content;
  if (typeof content !== "string") throw new Error("응답 형식을 해석하지 못했습니다: " + raw.slice(0, 200));
  return content;
}

function parseLLM(txt){
  let t = txt.trim().replace(/^```(?:json)?\s*/i, "").replace(/```\s*$/, "");
  const a = t.indexOf("{"), b = t.lastIndexOf("}");
  if (a >= 0 && b > a) t = t.slice(a, b + 1);
  try { const o = JSON.parse(t); return o && typeof o === "object" ? o : null; } catch (e) { return null; }
}

function ensurePanel(){
  let panel = card.querySelector(".llm");
  if (!panel) { panel = document.createElement("div"); panel.className = "llm"; card.appendChild(panel); }
  return panel;
}
function renderLLM(panel, data, rawText){
  const head = `<h4>🌍 익숙한 언어로 연결</h4>`;
  if (!data) { panel.innerHTML = head + `<pre>${esc(rawText)}</pre>`; return; }
  const arr = (x) => Array.isArray(x) ? x : [];
  panel.innerHTML = head +
    (data.english ? `<div class="row"><div class="lbl">ENGLISH</div><div class="val em">${esc(data.english)}</div></div>` : "") +
    (arr(data.similar).length ? `<div class="row"><div class="lbl">다른 언어의 비슷한 표현</div><ul>${arr(data.similar).map((s) => `<li><b>${esc(s.lang)}</b> · <span class="em">${esc(s.text)}</span>${s.ko ? ` — ${esc(s.ko)}` : ""}</li>`).join("")}</ul></div>` : "") +
    (data.koreanIdiom ? `<div class="row"><div class="lbl">한국어로는</div><div class="val">${esc(data.koreanIdiom)}</div></div>` : "") +
    (arr(data.cognates).length ? `<div class="row"><div class="lbl">같은 뿌리의 단어</div><ul>${arr(data.cognates).map((c) => `<li><span class="em">${esc(c.word)}</span> <small>(${esc(c.lang)})</small> — ${esc(c.meaning)}</li>`).join("")}</ul></div>` : "") +
    (data.tip ? `<div class="row tip">💡 ${esc(data.tip)}</div>` : "");
}

async function connectLanguages(p, id){
  const panel = ensurePanel();
  const cached = state.llmCache[p.d];
  if (cached && cached.la === p.la) {
    renderLLM(panel, cached.data, "");
    panel.scrollIntoView({ behavior: "smooth", block: "nearest" });
    await say(pick(LINES.connect), "happy");
    return;
  }
  if (!getKey()) {
    panel.remove();
    await say(LINES.nokey, "encourage");
    openKeyModal();
    return;
  }
  panel.innerHTML = `<h4>🌍 익숙한 언어로 연결</h4><p><span class="quill">🪶</span> 수사가 먼 나라의 서고에서 필사하는 중…</p>`;
  panel.scrollIntoView({ behavior: "smooth", block: "nearest" });
  say(LINES.thinking, "thinking");
  try {
    const txt = await callLLM(SYSTEM_PROMPT, `라틴어 표현: ${p.la}\n한국어 뜻: ${p.ko}`);
    if (!alive(id)) return;
    const data = parseLLM(txt);
    if (data) { state.llmCache[p.d] = { la: p.la, data }; save(); }
    renderLLM(panel, data, txt);
    panel.scrollIntoView({ behavior: "smooth", block: "nearest" });
    await say(pick(LINES.connect), "happy");
  } catch (e) {
    if (!alive(id)) return;
    panel.innerHTML = `<h4>🌍 익숙한 언어로 연결</h4><p class="err">${esc(e.message)}</p>`;
    await say(LINES.err, "encourage");
  }
}

});
$("#btnReset").addEventListener("click", () => {
  if (!confirm("진행 기록을 모두 지우고 오늘을 1일차로 다시 시작할까요? (API 키는 유지됩니다)")) return;
  state = { startDate: todayStr(), studyLog: [], completed: {}, streak: 0, lastDoneDate: null, llmCache: state.llmCache };
  save(); closeModals(); renderHeader(); openDay(1, LINES.welcome);
});

$("#btnList").addEventListener("click", () => {
  const n = todayN();
  const upto = n >= PHRASES.length ? PHRASES.length : n;
  const done = new Set(Object.keys(state.completed).filter((k) => state.completed[k]).map((k) => phraseFor(Number(k)).d));
  $("#list").innerHTML = PHRASES.slice(0, upto).reverse().map((p) =>
    `<li><span class="d">DIES ${p.d}</span><span><span class="la">${esc(p.la)}</span><span class="ko">${esc(p.ko)}</span></span><span class="ck">${done.has(p.d) ? "✓" : ""}</span></li>`).join("");
  openModal($("#listModal"));
});

/* ================= 시작 ================= */
renderHeader();
const n0 = todayN();
openDay(n0, firstVisit ? LINES.welcome : [pick(LINES.greet) + ` 오늘로 학습 ${n0}일째일세.`]);
</script>
</body>
</html>
